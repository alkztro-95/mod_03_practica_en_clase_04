######################################################################
# lab09_dab job (Free Edition: no existing_cluster_id -> serverless)
#
# NOTE: catalog_name comes from a bundle VARIABLE (${var.catalog_name}),
# overridden per target below in databricks.yml — not from a per-target
# override of this `parameters` array. Databricks documents merge-by-key
# target overrides for `tasks` (by task_key) and `job_clusters` (by
# job_cluster_key), but NOT for `parameters`, so overriding this array per
# target risks silently replacing it instead of merging — which would drop
# `display_target`. Driving the value through a variable sidesteps that
# ambiguity entirely.
######################################################################
resources:
  jobs:
    lab09_dab:
      name: lab09_dab_${workspace.current_user.userName}
      tasks:
        - task_key: create_nyc_tables
          notebook_task:
            notebook_path: ../src/our_project_code.sql
            source: WORKSPACE
      parameters:
        - name: display_target
          default: ${bundle.target}
        - name: catalog_name
          default: ${var.catalog_name}
